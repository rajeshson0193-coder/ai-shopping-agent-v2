[theme]
base = "light"
primaryColor = "#2F7A74"
backgroundColor = "#F8F6F1"
secondaryBackgroundColor = "#F1EEE7"
textColor = "#2A2E38"
borderColor = "#E2DDD3"
linkColor = "#2F7A74"
baseRadius = "0.875rem"
buttonRadius = "0.75rem"
showWidgetBorder = false
showSidebarBorder = false
baseFontSize = 16
headingFontSizes = ["3.75rem", "1.7rem", "1.3rem", "1.1rem", "1rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
paddingTop = "0rem"
paddingBottom = "0rem"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"

[theme.sidebar]
backgroundColor = "#10221F"
textColor = "#E7F3EF"
primaryColor = "#2BB5AD"
secondaryBackgroundColor = "#1A332E"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
